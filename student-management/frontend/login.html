<!DOCTYPE html>
<html>
<head>
    <title>Student Management Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

    <h1>Student Portal</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
